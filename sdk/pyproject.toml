[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptguard-client"
version = "0.1.0"
description = "Python SDK for PromptGuard's live guard API (/guard/*) -- protect any tool-calling agent in a few lines."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# ruff/mypy versions match backend/requirements-dev.txt for consistency.
dev = ["pytest>=8", "ruff==0.16.7", "mypy==2.3.1"]

[tool.setuptools]
packages = ["promptguard_client"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line-too-long — matches backend/pyproject.toml's ruff config
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
