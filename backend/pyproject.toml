[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F = pycodestyle errors + pyflakes (real correctness issues: unused
# imports/vars, undefined names, syntax problems). I = import sorting.
# UP = pyupgrade (modernize syntax for the target Python version).
# B = flake8-bugbear (common real bug patterns, e.g. mutable default args).
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line-too-long — line-length above already covers the real cases; don't fight docstrings/URLs
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
